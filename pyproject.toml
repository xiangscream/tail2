[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tail2-embodied-mvp"
version = "0.1.0"
description = "Tail2 capability and observation probes; real hardware verification pending"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["opencv-python>=4.10,<5"]

[project.scripts]
tail2-mvp = "tail2_mvp.__main__:main"

[tool.setuptools.packages.find]
include = ["tail2_mvp*"]

[tool.setuptools.package-data]
tail2_mvp = ["status.html"]
